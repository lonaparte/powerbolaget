<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Powerbolaget · Gutnö</title>
<link rel="preload" href="/pixel-font.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="/style.css"></head>
<body>
<header id="top">
 <a class="brand" href="/" title="Powerbolaget">⌁ <b>POWERBOLAGET</b><small id="ver">GUTNÖ</small></a>
 <div class="clock"><strong id="date">FE 1 · 01 Jan · 00:00</strong><span id="weekday"></span></div>
 <div class="time-controls">
  <button id="play" class="tb" title="Run or pause (space)">❚❚</button>
  <div class="speeds" role="group" aria-label="Simulation speed">
   <button data-speed="10" title="10 simulated minutes per second">1×</button><button data-speed="60" class="on" title="1 simulated hour per second">2×</button><button data-speed="360" title="6 simulated hours per second">3×</button><button data-speed="1440" title="1 simulated day per second (as fast as the server allows)">4×</button>
  </div>
  <span id="pace" class="pace"></span>
 </div>
 <div class="weather" id="weather"></div>
 <div class="balance" id="balance"></div>
 <button id="alerts" class="tb alerts" title="Recent events">0</button>
 <div class="menu">
  <button id="menuBtn" class="tb" aria-haspopup="true">SAVE ▾</button>
  <div id="menu" class="menu-list" hidden>
   <button data-menu="save">Save now</button><button data-menu="export">Export save file</button>
   <button data-menu="import">Load save file…</button><button data-menu="new">New game…</button>
   <button data-menu="about">Model and sources</button>
  </div>
 </div>
 <button id="themeToggle" class="tb theme" title="Day and night theme">◐</button>
 <input id="importFile" type="file" accept=".json,application/json" hidden>
</header>
<div id="app">
 <nav id="nav">
  <button data-view="island" class="on"><span>①</span> ISLAND</button>
  <button data-view="grid"><span>②</span> GRID</button>
  <button data-view="economy"><span>③</span> ECONOMY</button>
  <div id="layers" class="layers"></div>
  <div id="buildbar" class="buildbar"></div>
 </nav>
 <main id="stage">
  <div id="mapWrap" class="map-wrap"><canvas id="map"></canvas><div id="labels" class="labels"></div>
   <div id="legend" class="legend"></div><div id="hint" class="hint"></div><div id="tooltip" class="tooltip" hidden></div></div>
  <div id="econ" class="econ" hidden></div>
 </main>
 <aside id="inspector" class="inspector"></aside>
 <section id="dock" class="dock">
  <div class="dock-tabs"><button data-dock="chart" class="on">BALANCE</button><button data-dock="events">EVENTS</button><button data-dock="projects">PROJECTS</button><button data-dock="pins">PINNED</button><button id="dockToggle" class="dock-toggle" title="Show or hide">▾</button></div>
  <div id="dockBody" class="dock-body"><div id="charts" class="charts"><canvas id="chartMin"></canvas><canvas id="chartHour"></canvas></div><div id="events" hidden></div><div id="projects" hidden></div><div id="pins" hidden></div></div>
 </section>
</div>
<dialog id="dialog"><div id="dialogBody"></div></dialog>
<div id="toast" role="status"></div>
<div id="boot" class="boot"><b>POWERBOLAGET</b><span id="bootMsg">Starting the island…</span></div>
<script src="/js/core.js"></script>
<script src="/js/chart.js"></script>
<script src="/js/map.js"></script>
<script src="/js/inspector.js"></script>
<script src="/js/econ.js"></script>
<script src="/js/main.js"></script>
</body></html>
